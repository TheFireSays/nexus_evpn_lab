---
- name: Configure VTEP interface
  hosts: leafs
  gather_facts: false

  tasks:
    - name: Create NVE interface
      cisco.nxos.nxos_vxlan_vtep:
        interface: "{{ interface }}"
        description: "{{ description }}"
        host_reachability: "{{ host_reachability }}"
        source_interface: "{{ source_interface }}"
        shutdown: "{{ shutdown }}"
        source_interface_hold_down_time: "{{ source_interface_hold_down_time }}" 
