---
- name: Remove OSPF BFD from Dublin Multi-Site Topology
  hosts: all
  gather_facts: no
  serial: 1  # Process one device at a time to monitor impact
  
  vars:
    # Super-spine port-channels (connecting to site spines)
    superspine_pocs: [111, 112, 121, 122, 131, 132, 211, 212, 221, 222, 231, 232, 311, 312, 321, 322, 331, 332, 411, 412, 421, 422, 431, 432]
    
    # Site spine port-channels (uplinks to super-spines and downlinks to leafs)
    site_spine_pocs: [111, 211, 311, 411, 3131, 3132, 3231, 3232]
    
    # Leaf port-channels (uplinks to site spines)
    leaf_pocs: [3131, 3231, 3132, 3232]
  
  tasks:
    - name: Identify device role
      set_fact:
        device_role: "{{ 'superspine' if 'ssp' in inventory_hostname 
                         else 'spine' if 'sp' in inventory_hostname 
                         else 'leaf' if 'lf' in inventory_hostname 
                         else 'unknown' }}"
    
    - name: Set port-channel list based on device role
      set_fact:
        target_pocs: "{{ superspine_pocs if device_role == 'superspine'
                         else site_spine_pocs if device_role == 'spine'
                         else leaf_pocs if device_role == 'leaf'
                         else [] }}"
    
    - name: Display action plan
      debug:
        msg: "Removing OSPF BFD from {{ inventory_hostname }} ({{ device_role }}) - {{ target_pocs | length }} port-channels"
    
    - name: Remove OSPF BFD from port-channels
      cisco.nxos.nxos_config:
        lines:
          - no ip ospf bfd
        parents: "interface port-channel{{ item }}"
      loop: "{{ target_pocs }}"
      ignore_errors: yes
      register: bfd_removal
    
    - name: Check OSPF neighbor status before saving
      cisco.nxos.nxos_command:
        commands:
          - show ip ospf neighbors | include FULL
      register: ospf_check
    
    - name: Display OSPF status
      debug:
        msg: "OSPF neighbors on {{ inventory_hostname }}: {{ ospf_check.stdout_lines[0] | length }} FULL adjacencies"
    
    - name: Save configuration
      cisco.nxos.nxos_config:
        save_when: always
      when: bfd_removal is succeeded
    
    - name: Pause between devices
      pause:
        seconds: 5

- name: Final Verification
  hosts: all
  gather_facts: no
  
  tasks:
    - name: Verify no BFD configuration remains
      cisco.nxos.nxos_command:
        commands:
          - show running-config | include "ip ospf bfd"
          - show ip ospf neighbors
      register: final_check
    
    - name: Assert BFD is removed
      assert:
        that:
          - final_check.stdout[0] | length == 0
        fail_msg: "BFD still configured on {{ inventory_hostname }}"
        success_msg: "BFD successfully removed from {{ inventory_hostname }}"
    
    - name: Count OSPF neighbors
      set_fact:
        neighbor_count: "{{ final_check.stdout[1] | regex_findall('FULL') | length }}"
    
    - name: Display neighbor summary
      debug:
        msg: "{{ inventory_hostname }}: {{ neighbor_count }} OSPF neighbors in FULL state"

- name: Generate Summary Report
  hosts: localhost
  gather_facts: no
  
  tasks:
    - name: Final summary
      debug:
        msg:
          - "=========================================="
          - "BFD Removal Complete - All Devices"
          - "=========================================="
          - "Next steps:"
          - "1. Verify all OSPF adjacencies are FULL"
          - "2. Check routing tables"
          - "3. Test connectivity across sites"
          - "=========================================="
