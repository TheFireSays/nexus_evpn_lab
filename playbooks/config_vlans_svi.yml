---
- name: Create VLANs and SVIs
  hosts: leafs
  gather_facts: false

  tasks:
    - name: Create VLANs - ID, name, VNI
      cisco.nxos.nxos_vlans:
        config:
          - vlan_id: "(( item.id ))"
            name: "{{ item.name }}"
            mapped_vni: "{{ item.vni }}"
        state: active
        loop: "{{ vlans }}"

    - name: Create anycast SVIs
      cisco.nxos.nxos_l3_interfaces:
        config:
          - name: interfac vlan {{ item.id }}
            ipv4:
              address:
                "{{ item.svi.ip}}"
              description:
                "{{ item.svi.description }}"
        state: merged
      loop: "{{ vlans }}"

    - name: Show VLANs
      cisco.nxos.nxos_config:
        commands:
          - "show vlan"
      register: sh_vlans
        
    - name: Show SVIs
      cisco.nxos.nxos_config:
        commands:
          - "show ip interface brief | i vlan"
      register: sh_svis

    - name: Show VLANs
      ansible.builtin.debug:
        var: sh_vlans.stdout_lines

    - name: Show SVIs
      ansible.builtin.debug:
        var: sh_vlans.stdout_lines