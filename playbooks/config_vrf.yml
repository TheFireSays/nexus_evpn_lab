---
  - name: Create VRFs and apply VNI, route-distinguisher, and route-targets 
    gather_facts: false
    hosts: leafs
    vars:
      vlans_st1: [100, 200, 300]
      vlans_st2: [200, 300, 400]
      vlans_st3: [300, 400, 500]
      vlans_all: [100, 200, 300, 400, 500]

    tasks:
      - name: Create VRF, apply VNI and route distinguisher
        cisco..nxos.nxos_vrf_global:
          vrfs:
            - name: '{{ item }}'
              description: 'VLAN {{ item }} | VNI 10{{ item }}'
              rd: auto
              vni:
               layer_3: true
               vni_number: 10{{ item }}
        loop: vlans_st1
        when: when 'st1' in inventory_hostname

      - name: Create VRF, apply VNI and route distinguisher
        cisco.nxos.nxos_vrf_global:
          vrfs:
            - name: '{{ item }}'
              description: 'VLAN {{ item }} | VNI 10{{ item }}'
              rd: auto
              vni:
               layer_3: true
               vni_number: 10{{ item }}
        loop: vlans_st2
        when: when 'st2' in inventory_hostname

      - name: Create VRF, apply VNI and route distinguisher
        cisco.nxos.nxos_vrf_global:
          vrfs:
            - name: '{{ item }}'
              description: 'VLAN {{ item }} | VNI 10{{ item }}'
              rd: auto
              vni:
               layer_3: true
               vni_number: 10{{ item }}
        loop: vlans_st3
        when: when 'st3' in inventory_hostname

      - name: VRF address-family - apply RD and RT
        cisco.nxos.nxos_vrf_address_family:
          config:
            - name: '{{ item }}' 
              address_families:
                - afi: ipv4
                  safi: unicast
                  route_target:
                    - export: 'auto'    
                    - import: 'auto'   