---
- name: Check Current State of ST3 Leaf Port-Channels
  hosts: site3_leafs
  gather_facts: false
  
  tasks:
    - name: Get current running config for port-channels
      cisco.nxos.nxos_command:
        commands:
          - show run | section "^interface port-channel"
      register: po_config

    - name: Display current port-channel config
      ansible.builtin.debug:
        msg: |
          === {{ inventory_hostname }} Port-Channel Running Config ===
          {{ po_config.stdout[0] }}

    - name: Check if port-channels are L2 or L3
      cisco.nxos.nxos_command:
        commands:
          - show interface {{ item.name }}
      loop: "{{ l3_interfaces }}"
      register: intf_detail

    - name: Parse and display interface mode
      ansible.builtin.debug:
        msg: |
          {{ item.item.name }}:
          {{ item.stdout[0] | regex_search('.*switchport.*|.*IP address.*|.*Port mode.*', multiline=True) }}
      loop: "{{ intf_detail.results }}"

    - name: Check IP interface brief
      cisco.nxos.nxos_command:
        commands:
          - show ip interface brief
      register: ip_brief

    - name: Display all IP interfaces
      ansible.builtin.debug:
        msg: |
          === {{ inventory_hostname }} All IP Interfaces ===
          {{ ip_brief.stdout[0] }}

    - name: Check what l3_interfaces variable contains
      ansible.builtin.debug:
        msg: |
          === {{ inventory_hostname }} l3_interfaces variable ===
          {{ l3_interfaces | to_nice_json }}
      when: l3_interfaces is defined