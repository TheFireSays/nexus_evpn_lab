---
# Apply MTU-ignore to fix OSPF EXSTART issue
- name: Fix Site 3 OSPF with MTU-ignore
  hosts: dub-st3-sp1,dub-st3-sp2,dub-st3-lf1,dub-st3-lf2,dub-ssp1,dub-ssp2,dub-ssp3,dub-ssp4
  gather_facts: false
  
  vars:
    device_interfaces:
      dub-st3-sp1:
        - port-channel111
        - port-channel211
        - port-channel311
        - port-channel411
        - port-channel3131
        - port-channel3132
      dub-st3-sp2:
        - port-channel111
        - port-channel211
        - port-channel311
        - port-channel411
        - port-channel3231
        - port-channel3232
      dub-st3-lf1:
        - port-channel3131
        - port-channel3231
      dub-st3-lf2:
        - port-channel3132
        - port-channel3232
      dub-ssp1:
        - port-channel131
        - port-channel132
      dub-ssp2:
        - port-channel231
        - port-channel232
      dub-ssp3:
        - port-channel331
        - port-channel332
      dub-ssp4:
        - port-channel431
        - port-channel432

  tasks:
    - name: Apply OSPF MTU-ignore to interfaces
      cisco.nxos.nxos_config:
        lines:
          - ip ospf mtu-ignore
        parents: "interface {{ item }}"
      loop: "{{ device_interfaces[inventory_hostname] }}"
      register: mtu_config

    - name: Clear OSPF to force re-negotiation
      cisco.nxos.nxos_command:
        commands:
          - clear ip ospf 100
      vars:
        ansible_command_timeout: 60

    - name: Wait for OSPF adjacencies to reform
      pause:
        seconds: 30
        prompt: "Waiting for OSPF to converge..."

    - name: Verify OSPF neighbors
      cisco.nxos.nxos_command:
        commands:
          - show ip ospf neighbor
      register: ospf_verify

    - name: Parse OSPF neighbors
      ansible.utils.cli_parse:
        text: "{{ ospf_verify.stdout[0] }}"
        parser:
          name: ansible.netcommon.ntc_templates
          command: show ip ospf neighbor
          os: cisco_nxos
      register: parsed_neighbors

    - name: Check for non-FULL neighbors
      set_fact:
        non_full: "{{ parsed_neighbors.parsed | rejectattr('state', 'search', 'FULL') | list }}"
        full_count: "{{ parsed_neighbors.parsed | selectattr('state', 'search', 'FULL') | list | length }}"
        total_count: "{{ parsed_neighbors.parsed | length }}"

    - name: Display results
      debug:
        msg:
          - "{{ inventory_hostname }}: {{ full_count }}/{{ total_count }} adjacencies FULL"
          - "{% if non_full | length == 0 %}✅ ALL ADJACENCIES FULL!{% else %}⚠️ {{ non_full | length }} still incomplete{% endif %}"

    - name: Show remaining issues
      debug:
        msg: "Still EXSTART: {{ item.neighbor_ipaddr }} on {{ item.interface }}"
      loop: "{{ non_full }}"
      when: non_full | length > 0

- name: Final Verification
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Success message
      debug:
        msg:
          - "========================================="
          - "MTU-IGNORE APPLIED TO SITE 3"
          - "========================================="
          - ""
          - "Configuration applied to:"
          - "  - All 4 Site 3 devices"
          - "  - All 4 Superspines (Site 3 links only)"
          - ""
          - "Run verify_ospf_neighbors.yml to confirm all sites healthy"
